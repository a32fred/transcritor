<svg xmlns="http://www.w3.org/2000/svg" width="246" height="48" viewBox="0 0 246 48" role="img" aria-labelledby="logoEscuroTitle logoEscuroDesc">
  <title id="logoEscuroTitle">transcritor</title>
  <desc id="logoEscuroDesc">Logotipo do transcritor em cores claras: uma forma de onda que decresce até virar linhas de texto, seguida da palavra transcritor em minúsculas monoespaçadas.</desc>

  <!--
    transcritor — logotipo horizontal, tema escuro (uso sobre fundo escuro, ex.: README no tema escuro)
    Forma de onda e texto #e6edf3 (fg)
    Cursor #4cc2ff (accent)
    Fundo transparente, vetorial, sem raster e sem image.
  -->
  <g transform="translate(2 0) scale(1.5)">
    <g fill="#e6edf3">
      <rect x="1.4" y="4.5" width="2.9" height="23" rx="1.45"/>
      <rect x="6.6" y="8" width="2.9" height="16" rx="1.45"/>
      <rect x="11.8" y="10.75" width="2.9" height="10.5" rx="1.45"/>
      <rect x="17.6" y="7.2" width="12.9" height="3.2" rx="1.6"/>
      <rect x="17.6" y="14.4" width="12.9" height="3.2" rx="1.6"/>
      <rect x="17.6" y="21.6" width="6.6" height="3.2" rx="1.6"/>
    </g>
    <rect x="26.8" y="19.5" width="3.6" height="7.4" rx="1" fill="#4cc2ff"/>
  </g>

  <text x="58" y="34.5" fill="#e6edf3"
        font-family="&quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Consolas, monospace"
        font-size="28" font-weight="700" textLength="186" lengthAdjust="spacingAndGlyphs">transcritor</text>
</svg>
