<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-labelledby="markTitle markDesc">
  <title id="markTitle">transcritor</title>
  <desc id="markDesc">Símbolo do transcritor: uma forma de onda que decresce e se transforma em linhas de texto, terminando em um cursor de terminal.</desc>

  <!--
    transcritor — símbolo
    Conceito: som que vira texto, sem sair da máquina.
    À esquerda, uma forma de onda em decaimento (o áudio).
    À direita, as linhas do texto transcrito.
    No fim da última linha, o cursor do terminal: onde o texto é lido.

    Cores (tema claro, para uso sobre fundo branco ou claro):
      tinta  #0e1116  (cor de fundo do produto, invertida)
      cursor #0a6f9e  (accent #4cc2ff escurecido para contraste em fundo claro)
    Funciona em monocromia: a leitura depende só da silhueta das formas.
    Fundo transparente, vetorial, sem raster e sem image.
  -->
  <g fill="#0e1116">
    <!-- forma de onda em decaimento -->
    <rect x="1.4" y="4.5" width="2.9" height="23" rx="1.45"/>
    <rect x="6.6" y="8" width="2.9" height="16" rx="1.45"/>
    <rect x="11.8" y="10.75" width="2.9" height="10.5" rx="1.45"/>
    <!-- linhas do texto transcrito -->
    <rect x="17.6" y="7.2" width="12.9" height="3.2" rx="1.6"/>
    <rect x="17.6" y="14.4" width="12.9" height="3.2" rx="1.6"/>
    <rect x="17.6" y="21.6" width="6.6" height="3.2" rx="1.6"/>
  </g>
  <!-- cursor do terminal (ponto de inserção) -->
  <rect x="26.8" y="19.5" width="3.6" height="7.4" rx="1" fill="#0a6f9e"/>
</svg>
