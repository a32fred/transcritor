name: Publicar no PyPI

# Um lançamento publicado no GitHub (etiqueta vX.Y.Z) vira pacote no PyPI.
#
# O envio usa Trusted Publishing: o PyPI confia neste repositório, neste
# arquivo e neste ambiente por OIDC, e o token é gerado na hora. Nada de token
# guardado em segredo do GitHub, que pode vazar ou vencer.
#
# Configuração única, feita uma vez no site do PyPI, em
# https://pypi.org/manage/account/publishing/ (e depois em
# https://pypi.org/manage/project/transcritor/settings/publishing/):
#
#   PyPI Project Name : transcritor
#   Owner             : a32fred
#   Repository name   : transcritor
#   Workflow name     : publish.yml
#   Environment name  : pypi
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta do lançamento existente (por exemplo, v1.1.1)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  construir:
    name: Construir e conferir os artefatos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir a wheel e o pacote de código-fonte
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Conferir que a etiqueta e o pacote têm a mesma versão
        run: |
          versao_tag="${RELEASE_TAG#v}"
          versao_pacote=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$versao_tag" = "$versao_pacote"
      - name: Conferir os metadados como o PyPI confere
        run: python -m twine check --strict dist/*
      # Só publica o que instala: as dependências vêm do PyPI de verdade, então
      # um nome errado em [project.dependencies] para o envio aqui.
      - name: Instalar a wheel num ambiente limpo
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/transcrever --version
      - name: Guardar os artefatos para o envio
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pacote-rpm:
    name: Construir e instalar o RPM Fedora 44
    needs: construir
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 35
    steps:
      - name: Obter o código da etiqueta
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Instalar ferramentas RPM
        run: dnf install -y rpm-build redhat-rpm-config python3-devel python3-pip
      - name: Baixar o sdist conferido
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Construir e instalar
        run: |
          ./packaging/rpm/build.sh --sdist "dist/transcritor-$(sed -n 's/^Version:[[:space:]]*//p' packaging/rpm/transcritor.spec | head -1).tar.gz"
          rpm -qpl dist/transcritor-*.rpm | grep -q '^/usr/share/man/man1/transcrever.1.gz$'
          dnf install -y --setopt=install_weak_deps=False dist/transcritor-*.rpm
          transcrever --version
          /usr/lib64/transcritor/venv/bin/python -B -c "import av, ctranslate2, numpy, onnxruntime, tokenizers; print('dependências nativas carregadas')"
          test -f /usr/share/applications/transcritor.desktop
          test -f /usr/share/applications/transcritor-arquivo.desktop
      - name: Guardar RPM para o lançamento
        uses: actions/upload-artifact@v4
        with:
          name: transcritor-rpm
          path: dist/*.rpm

  pacote-deb:
    name: Construir e instalar o .deb Ubuntu 24.04
    needs: construir
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Obter o código da etiqueta
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Baixar o sdist conferido
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Construir e instalar
        run: |
          chmod +x packaging/deb/build.sh
          ./packaging/deb/build.sh --sdist "dist/transcritor-$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])').tar.gz"
          sudo dpkg -i dist/*.deb
          transcrever --version
          /usr/lib/transcritor/venv/bin/python -B -c "import av, ctranslate2, numpy, onnxruntime, tokenizers; print('dependências nativas carregadas')"
          test -f /usr/share/applications/transcritor.desktop
          test -f /usr/share/applications/transcritor-arquivo.desktop
          test -f /usr/share/man/man1/transcrever.1.gz
      - name: Guardar .deb para o lançamento
        uses: actions/upload-artifact@v4
        with:
          name: transcritor-deb
          path: dist/*.deb

  anexar-linux:
    name: Anexar pacotes Linux ao lançamento
    needs: [pacote-rpm, pacote-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o RPM
        uses: actions/download-artifact@v4
        with:
          name: transcritor-rpm
          path: dist/
      - name: Baixar o .deb
        uses: actions/download-artifact@v4
        with:
          name: transcritor-deb
          path: dist/
      - name: Anexar ao lançamento publicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.rpm dist/*.deb --repo a32fred/transcritor --clobber

  publicar:
    name: Enviar para o PyPI
    needs: construir
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/transcritor
    permissions:
      id-token: write      # Trusted Publishing: o token do PyPI nasce aqui
      attestations: write  # atestados digitais dos arquivos (PEP 740)
    steps:
      - name: Baixar os artefatos conferidos
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Não tentar substituir uma versão já publicada
        id: versao
        run: |
          versao="${RELEASE_TAG#v}"
          if curl --fail --silent --show-error --location \
            "https://pypi.org/pypi/transcritor/${versao}/json" -o /dev/null; then
            echo "ja_publicada=true" >> "$GITHUB_OUTPUT"
          else
            echo "ja_publicada=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar
        if: steps.versao.outputs.ja_publicada == 'false'
        # Ação oficial do projeto PyPA. Publicar por etiqueta de versão, nunca
        # por ramo: o pacote do PyPI não pode ser reescrito depois.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
