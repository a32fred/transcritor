name: Integração contínua

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes e lint / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar ffmpeg e ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # `ruff` fica fixado: o resultado do lint muda entre versões, e uma
          # regra alterada em silêncio quebraria o CI sem mudança no código.
          pip install pytest "ruff==0.17.1"
      - name: Verificar código e testes com Ruff
        continue-on-error: false
        run: ruff check transcritor tests
      # O motor é dublado nos testes: não baixar modelos nesta CI.
      - name: Executar testes sem GPU nem modelos
        run: python -m pytest tests/ -q --durations=10

  empacotamento:
    name: Artefatos e instalação de teste
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ffmpeg e ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Construir a wheel e o pacote de código-fonte
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Conferir os metadados como o PyPI confere
        run: python -m twine check --strict dist/*
      # A suíte roda fora do repositório de propósito: é a única forma de o
      # Python importar o pacote instalado em vez do código ao lado dos testes.
      - name: Rodar a suíte contra a wheel instalada
        run: |
          python -m venv /tmp/venv-wheel
          /tmp/venv-wheel/bin/pip install dist/*.whl pytest
          cp -r tests /tmp/suite
          cd /tmp/suite && /tmp/venv-wheel/bin/python -m pytest . -q
      - name: Conferir que os dados do pacote foram publicados
        run: |
          /tmp/venv-wheel/bin/python -c "import importlib, pathlib, pkgutil, transcritor; \
          [importlib.import_module(m.name) for m in pkgutil.walk_packages(transcritor.__path__, 'transcritor.')]; \
          dados = pathlib.Path(transcritor.__file__).parent; \
          assert (dados / 'web/templates/index.html').exists(), 'falta o template da interface'; \
          assert len(list((dados / 'data').iterdir())) == 3, 'faltam os .desktop e o ícone'; \
          print('todos os módulos importam e os dados do pacote estão na wheel')"
      - name: Instalar e usar a partir do pacote de código-fonte
        run: |
          python -m venv /tmp/venv-sdist
          /tmp/venv-sdist/bin/pip install dist/*.tar.gz
          /tmp/venv-sdist/bin/transcrever --version
          /tmp/venv-sdist/bin/transcrever info
      - name: Guardar os artefatos
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pacote-rpm:
    name: RPM Fedora 44 (instalação real)
    needs: empacotamento
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 35
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
      - name: Instalar ferramentas RPM
        run: dnf install -y rpm-build redhat-rpm-config python3-devel python3-pip
      - name: Baixar o sdist já conferido
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Construir o RPM
        run: ./packaging/rpm/build.sh --sdist "dist/transcritor-$(sed -n 's/^Version:[[:space:]]*//p' packaging/rpm/transcritor.spec | head -1).tar.gz"
      - name: Instalar pelo DNF e conferir o comando e a área de trabalho
        run: |
          dnf install -y --setopt=install_weak_deps=False dist/transcritor-*.rpm
          transcrever --version
          /usr/lib64/transcritor/venv/bin/python -B -c "import av, ctranslate2, numpy, onnxruntime, tokenizers; print('dependências nativas carregadas')"
          test -f /usr/share/applications/transcritor.desktop
          test -f /usr/share/applications/transcritor-arquivo.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/transcritor.svg
          test -f /usr/share/man/man1/transcrever.1.gz
          ! rpm -qp --requires dist/transcritor-*.rpm | grep -E 'lib(av|swscale|avcodec|ctranslate2)'
      - name: Guardar o RPM conferido
        uses: actions/upload-artifact@v4
        with:
          name: transcritor-rpm
          path: dist/*.rpm

  pacote-deb:
    name: DEB Ubuntu 24.04 (instalação real)
    needs: empacotamento
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Baixar o sdist já conferido
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Construir o .deb
        run: |
          chmod +x packaging/deb/build.sh
          ./packaging/deb/build.sh --sdist "dist/transcritor-$(python -c 'from transcritor import __version__; print(__version__)').tar.gz"
      - name: Instalar pelo dpkg e conferir o comando e a área de trabalho
        run: |
          sudo dpkg -i dist/*.deb
          transcrever --version
          /usr/lib/transcritor/venv/bin/python -B -c "import av, ctranslate2, numpy, onnxruntime, tokenizers; print('dependências nativas carregadas')"
          dpkg-deb --info dist/*.deb
          test -f /usr/share/applications/transcritor.desktop
          test -f /usr/share/applications/transcritor-arquivo.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/transcritor.svg
          test -f /usr/share/man/man1/transcrever.1.gz
      - name: Guardar o .deb conferido
        uses: actions/upload-artifact@v4
        with:
          name: transcritor-deb
          path: dist/*.deb
