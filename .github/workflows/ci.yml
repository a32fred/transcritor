name: Integração contínua

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes e lint / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar ffmpeg e ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Verificar código e testes com Ruff
        continue-on-error: false
        run: ruff check transcritor tests
      # O motor é dublado nos testes: não baixar modelos nesta CI.
      - name: Executar testes sem GPU nem modelos
        run: python -m pytest tests/ -q --durations=10
